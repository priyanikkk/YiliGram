name: Build

# Debug APK for every push / pull request, signed release APKs for v* tags.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   YILI_API_ID, YILI_API_HASH         Telegram API credentials (https://my.telegram.org)
#   YILI_KEYSTORE_BASE64               release keystore, `base64 -w0 yiligram-release.jks`
#   YILI_KEYSTORE_PASSWORD, YILI_KEY_ALIAS, YILI_KEY_PASSWORD
# Without the API secrets (e.g. pull requests from forks) the debug APK is still built,
# but it cannot log in.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.2.12479018
  CMAKE_VERSION: 3.22.1
  # yili-hook builds LSPlant from source (C++23 modules): newer NDK and CMake.
  HOOK_NDK_VERSION: 30.0.16248370
  HOOK_CMAKE_VERSION: 3.31.6

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check out submodules
        # LSPlant's own test submodules (lsparself, lsprism) are not public: skip them and fetch only
        # what the app builds (LSPlant + dex_builder). Everything else recursively, over HTTPS.
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1
          git submodule foreach --quiet 'if [ "$sm_path" != "yili-hook/lsplant" ]; then git submodule update --init --recursive --depth 1; fi'
          git -C yili-hook/lsplant submodule update --init --recursive --depth 1 lsplant/src/main/jni/external/dex_builder

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" "ndk;${HOOK_NDK_VERSION}" "cmake;${HOOK_CMAKE_VERSION}" \
            "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # Chaquopy installs the plugin runtime's packages with it

      - uses: gradle/actions/setup-gradle@v4

      - name: Check M3 theme bridge keys
        run: python3 tools/check_theme_keys.py

      - name: Design system unit tests
        run: ./gradlew --no-daemon :yili-design:testDebugUnitTest

      - name: Plugin engine tests
        run: python3.11 -m unittest discover -s TMessagesProj_App/src/test/python

      - name: Decide build type
        id: mode
        env:
          HAS_API: ${{ secrets.YILI_API_ID != '' }}
          HAS_KEYSTORE: ${{ secrets.YILI_KEYSTORE_BASE64 != '' }}
        run: |
          # Signed release APKs only for v* tags when the release keystore secret exists; test tags
          # (published with tools/release/publish.sh) and repositories without it build the debug APK.
          if [[ "$GITHUB_REF" == refs/tags/v* && "$HAS_KEYSTORE" == "true" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "task=:TMessagesProj_App:assembleAfatRelease" >> "$GITHUB_OUTPUT"
            echo "abis=" >> "$GITHUB_OUTPUT"
          else
            # Debug builds compile native code for arm64 only to keep CI fast.
            echo "task=:TMessagesProj_App:assembleAfatDebug" >> "$GITHUB_OUTPUT"
            echo "abis=-PyiliAbis=arm64-v8a" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$HAS_API" != "true" ]]; then
            echo "skipapi=-PyiliSkipApiCheck" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore release keystore
        if: steps.mode.outputs.release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.YILI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::YILI_KEYSTORE_BASE64 secret is not set; refusing to publish an unsigned release"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "YILI_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          YILI_API_ID: ${{ secrets.YILI_API_ID }}
          YILI_API_HASH: ${{ secrets.YILI_API_HASH }}
          YILI_KEYSTORE_PASSWORD: ${{ secrets.YILI_KEYSTORE_PASSWORD }}
          YILI_KEY_ALIAS: ${{ secrets.YILI_KEY_ALIAS }}
          YILI_KEY_PASSWORD: ${{ secrets.YILI_KEY_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon --stacktrace ${{ steps.mode.outputs.skipapi }} ${{ steps.mode.outputs.abis }} ${{ steps.mode.outputs.task }}

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: YiliGram-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TMessagesProj_App/build/outputs/apk/afat/release/*.apk
          generate_release_notes: true
