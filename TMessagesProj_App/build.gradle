apply plugin: 'com.android.application'
apply plugin: 'org.telegram.build-app-plugin'
apply plugin: 'com.chaquo.python'

repositories {
    mavenCentral()
    google()
}

configurations {
    compile.exclude module: 'support-v4'
}

configurations.all {
    exclude group: 'com.google.firebase', module: 'firebase-core'
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
}

dependencies {
    implementation project(':TMessagesProj')
    // Java method hooks for plugins (LSPlant); used from Python through hook_utils.
    implementation project(':yili-hook')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation files('../TMessagesProj/libs/libgsaverification-client.aar')
}

android {
    compileSdkVersion 36
    buildToolsVersion '36.0.0'

    defaultConfig.applicationId = APP_PACKAGE


    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true
    }

    androidResources {
        noCompress += "pack"
        localeFilters += ["zz"]
    }

    // YILI: debug builds use the standard Android debug key; release builds are signed with
    // the key described in keystore.properties (git-ignored, see keystore.properties.example)
    // or YILI_KEYSTORE_* environment variables. Without either, release APKs are unsigned.
    def keystoreProps = new Properties()
    def keystorePropsFile = rootProject.file('keystore.properties')
    if (keystorePropsFile.exists()) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
    }
    def ks = { String key, String env -> (keystoreProps.getProperty(key) ?: System.getenv(env))?.trim() }
    def releaseStoreFile = ks('storeFile', 'YILI_KEYSTORE_FILE')
    signingConfigs {
        if (releaseStoreFile) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword ks('storePassword', 'YILI_KEYSTORE_PASSWORD')
                keyAlias ks('keyAlias', 'YILI_KEY_ALIAS')
                keyPassword ks('keyPassword', 'YILI_KEY_PASSWORD')
            }
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            applicationIdSuffix ".beta"
            minifyEnabled false
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }

        standalone {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.findByName('release')
            applicationIdSuffix ".web"
            minifyEnabled true
            shrinkResources true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }

        release {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.findByName('release')
            minifyEnabled true
            shrinkResources true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
    }

    sourceSets.debug {
        manifest.srcFile '../TMessagesProj/config/debug/AndroidManifest.xml'
    }

    sourceSets.standalone {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest.xml'
    }

    sourceSets.release {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest.xml'
    }

    flavorDimensions "minApi"

    productFlavors {
        bundleAfat {
            ndk {
                abiFilters(*rootProject.ext.yiliAbiFilters.call(["armeabi-v7a", "arm64-v8a", "x86", "x86_64"]))
            }
            ext {
                abiVersionCode = 1
            }
            buildConfigField "boolean", "BUNDLE", "true"
        }
        afat {
            ndk {
                abiFilters(*rootProject.ext.yiliAbiFilters.call(["armeabi-v7a", "arm64-v8a", "x86", "x86_64"]))
            }
            sourceSets.debug {
                manifest.srcFile '../TMessagesProj/config/debug/AndroidManifest_SDK23.xml'
            }
            sourceSets.release {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_SDK23.xml'
            }
            sourceSets.standalone {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
            }
            ext {
                abiVersionCode = 9
            }
            buildConfigField "boolean", "BUNDLE", "false"
        }
    }

    defaultConfig.versionCode = Integer.parseInt(YILI_VERSION_CODE)

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "YiliGram-${YILI_VERSION_NAME}-${variant.buildType.name}.apk"
            output.versionCodeOverride = defaultConfig.versionCode * 10 + variant.productFlavors.get(0).abiVersionCode
        }
    }

    variantFilter { variant ->
        def names = variant.flavors*.name
        if (variant.buildType.name != "release" && !names.contains("afat")) {
            setIgnore(true)
        }
    }

    defaultConfig {
        minSdkVersion 24 // YILI: Chaquopy 17 needs API 24
        targetSdkVersion 36
        versionName YILI_VERSION_NAME
        ndkVersion "27.2.12479018"

        multiDexEnabled true

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        externalNativeBuild {
            cmake {
                version '3.22.1'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-23' // , '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                targets 'tmessages.49', 'twidget'
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }
    namespace 'org.telegram.messenger.regular'

    lintOptions {
        checkReleaseBuilds false
    }
}

// YILI: no google-services plugin, see TMessagesProj/build.gradle.

// YILI: Python 3.11 for exteraGram-compatible plugins. Chaquopy installs the preinstalled packages
// at build time with a host Python of the same version: set yili.buildPython in local.properties
// (or YILI_BUILD_PYTHON), otherwise python3.11 from PATH is used.
chaquopy {
    defaultConfig {
        version "3.11"
        def buildPy = rootProject.ext.yiliSecret.call('yili.buildPython', 'YILI_BUILD_PYTHON')
        buildPython(buildPy ? buildPy : "python3.11")
        pip {
            install "requests"
            install "beautifulsoup4"
            install "lxml"
            install "pillow"
            install "PyYAML"
            install "packaging"
        }
    }
}

