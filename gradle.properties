#Sat Mar 12 05:53:50 MSK 2016
APP_VERSION_CODE=7303
APP_VERSION_NAME=13.2.2
APP_PACKAGE=com.yiligram.messenger
# YiliGram's own version; APP_VERSION_* above track the upstream Telegram base.
YILI_VERSION_NAME=0.1.0
YILI_VERSION_CODE=4
# Where "update the app" buttons lead.
YILI_RELEASES_URL=https://github.com/yiligram/YiliGram/releases
IS_PRIVATE=false
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=false
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.enableR8.fullMode=true
android.r8.optimizedResourceShrinking=true
android.enableResourceOptimizations=true
org.gradle.tooling.parallel=true
