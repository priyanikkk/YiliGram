// YiliGram Java method hooks for plugins: LSPlant (ART method hooking) + Dobby (inline hooks)
// + our own libart symbol resolver (.dynsym, .symtab and MiniDebugInfo/.gnu_debugdata).
//
// LSPlant is built from source (git submodule yili-hook/lsplant): the last release on Maven
// (6.4, April 2024) does not know current ART mainline updates. It is written with C++23
// modules (`import std;`), so this module needs a newer NDK and CMake than the rest of the app,
// plus LSPosed's libcxx prefab package, which ships the std module sources.
apply plugin: 'com.android.library'

android {
    namespace 'com.yiligram.hook'
    compileSdkVersion 36
    buildToolsVersion '36.0.0'
    ndkVersion "30.0.16248370"

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 36
        consumerProguardFiles 'consumer-rules.pro'
        ndk {
            abiFilters(*rootProject.ext.yiliAbiFilters.call(["armeabi-v7a", "arm64-v8a", "x86", "x86_64"]))
        }
        externalNativeBuild {
            cmake {
                // Self-contained: libc++ (with std modules) is linked statically from the prefab.
                arguments '-DANDROID_STL=none', '-DLSPLANT_STANDALONE=ON', '-DLSPLANT_BUILD_SHARED=OFF',
                        '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }

    buildFeatures {
        prefab true
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.31.6'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lintOptions {
        checkReleaseBuilds false
    }
}

dependencies {
    // Prebuilt AARs with prefab packages (headers + native libraries).
    implementation 'org.lsposed.libcxx:libcxx:30.0.16248370'
    implementation 'io.github.vvb2060.ndk:dobby:1.2'
    // LSPlant itself and plugins reflect into hidden framework APIs (Android 9+ blocks them).
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'
}
